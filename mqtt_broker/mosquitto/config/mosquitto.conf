# ===============================
# MQTT Listener
# ===============================
listener 1883
protocol mqtt

# ===============================
# Persistence
# ===============================
persistence true
persistence_location /mosquitto/data/

# ===============================
# Logging
# ===============================
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# ===============================
# Security
# ===============================
allow_anonymous true
password_file /mosquitto/config/passwords.txt
